name: 🚀 Automated CI/CD Testing & Docker Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: 🧪 Pytest Matrix (OS: ${{ matrix.os }} | Python: ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set Up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 📦 Install Project Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: 🔍 Lint & Syntax Verification
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__,.pytest_cache,venv
          # Treat all other issues as non-blocking warnings
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=160 --statistics --exclude=.git,__pycache__,.pytest_cache,venv

      - name: 🧪 Execute Automated Pytest Suite with Coverage
        run: |
          python -m pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: 🚀 Verify Streamlit App Loading
        run: |
          python -u -c "import app; print('Streamlit app components validated successfully for CI/CD!')"

  docker:
    name: 🐳 Docker Container Build & Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Set Up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: 🐳 Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: student-performance-predictor:latest
